name: Test

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      RIOT_API_TOKEN: ${{ secrets.RIOT_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --frozen ruff check src tests

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests

      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests -p "test_*.py"

      - name: Run Riot API integration tests
        if: env.RIOT_API_TOKEN != ''
        run: uv run --frozen python tests/test_client.py
