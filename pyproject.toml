[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valaw"
version = "0.1.12"
description = "Async Python wrapper for the Official VALORANT API (Riot Games). Fast, typed, and easy to use."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jet612" }]
keywords = ["valorant", "riot-games", "api-wrapper", "python-valorant", "async", "gaming"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
]
dependencies = [
    "aiohttp>=3.14.3,<4",
    "dataclass-wizard>=1.0.0,<2",
]

[project.urls]
Source = "https://github.com/Jet612/valaw"
Documentation = "https://valaw.madebyjet.dev"
"Issue Tracker" = "https://github.com/Jet612/valaw/issues"
"Chat/Support" = "https://discord.gg/mVXpvunBbF"

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.2.3,<2",
    "ruff>=0.16.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
